<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oliver's Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: 'Nunito', sans-serif; touch-action: none; }
        
        canvas { display: block; }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Quest Tracker */
        #quest-tracker {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: auto; border: 4px solid #333;
        }
        #quest-tracker h2 { margin: 0 0 10px 0; font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: #333; }
        .quest-item { font-size: 1.1rem; margin: 8px 0; color: #666; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .quest-item.found { color: #2ecc71; text-decoration: line-through; font-weight: bold; }

        /* Virtual Joystick */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 140px; height: 140px;
            background: rgba(255, 255, 255, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; pointer-events: auto;
            display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: absolute; transition: 0.1s ease-out;
        }

        /* Notifications */
        #toast {
            position: absolute; top: 20px; right: 20px;
            background: #f1c40f; color: #333; font-weight: bold;
            padding: 15px 30px; border-radius: 30px;
            font-family: 'Fredoka One', cursive;
            opacity: 0; transform: translateY(-20px);
            transition: 0.3s; pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Ending Screen */
        #ending-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 1s; color: white; text-align: center;
        }
        #ending-screen.visible { opacity: 1; pointer-events: auto; }
        #ending-screen h1 { font-family: 'Fredoka One', cursive; font-size: 4rem; margin: 0; color: #f1c40f; text-shadow: 0 5px 20px rgba(241, 196, 15, 0.5); }
        #ending-screen p { font-size: 1.5rem; margin-top: 20px; max-width: 600px; line-height: 1.5; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="quest-tracker">
            <h2>Oliver's Quest</h2>
            <div id="q-beach" class="quest-item">🐚 The Golden Seashell</div>
            <div id="q-swim" class="quest-item">🏊‍♂️ The Swimmer's Goggles</div>
            <div id="q-ireland" class="quest-item">☘️ The Emerald Shamrock</div>
            <div id="q-drama" class="quest-item">🎭 The Tragedy Masks</div>
            <div id="q-sing" class="quest-item">🎤 The Silver Microphone</div>
        </div>

        <div id="toast">Item Found!</div>

        <!-- Touch Controls -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <!-- Final Win Screen -->
        <div id="ending-screen">
            <h1>Happy 19th Birthday<br>Oliver!</h1>
            <p>You've conquered the seas, explored the emerald hills, owned the stage, and found your voice.</p>
        </div>
    </div>

    <!-- Confetti Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game World Setup (2500x2500 pixels)
        const WORLD_SIZE = 2500;
        
        const player = {
            x: 1250, y: 1250, radius: 25, speed: 7, vx: 0, vy: 0, color: '#fff'
        };

        const camera = { x: 0, y: 0 };

        // Define Biomes
        const biomes = [
            { name: "The Sunny Beach", color: "#F4D03F", x: 0, y: 0, w: 1250, h: 1250 },
            { name: "The Deep Ocean", color: "#3498DB", x: 1250, y: 0, w: 1250, h: 1250 },
            { name: "The Emerald Hills (Ireland)", color: "#2ECC71", x: 0, y: 1250, w: 1250, h: 1250 },
            { name: "The Grand Stage (Drama)", color: "#E74C3C", x: 1250, y: 1250, w: 1250, h: 1250 }
        ];

        // Items to collect
        let items = [
            { id: 'q-beach', icon: '🐚', x: 200, y: 200, collected: false },
            { id: 'q-swim', icon: '🏊‍♂️', x: 2300, y: 200, collected: false },
            { id: 'q-ireland', icon: '☘️', x: 200, y: 2300, collected: false },
            { id: 'q-drama', icon: '🎭', x: 2300, y: 2300, collected: false },
            { id: 'q-sing', icon: '🎤', x: 1250, y: 1250, collected: false } // Center
        ];

        // Obstacles to create a maze-like feel
        const walls = [
            { x: 500, y: 0, w: 50, h: 800 },
            { x: 1200, y: 400, w: 800, h: 50 },
            { x: 400, y: 1200, w: 600, h: 50 },
            { x: 1800, y: 1500, w: 50, h: 700 },
            { x: 0, y: 1800, w: 700, h: 50 },
            { x: 1200, y: 1200, w: 50, h: 500 }
        ];

        // Input Handling (Keyboard fallback for testing)
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Virtual Joystick Logic
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyCenter = { x: 0, y: 0 };

        joyZone.addEventListener('touchstart', (e) => {
            joyActive = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            joyKnob.style.transition = '0s';
            updateJoystick(e.touches[0]);
        });

        joyZone.addEventListener('touchmove', (e) => {
            if(!joyActive) return;
            e.preventDefault(); // Stop scrolling
            updateJoystick(e.touches[0]);
        }, { passive: false });

        joyZone.addEventListener('touchend', () => {
            joyActive = false;
            player.vx = 0; player.vy = 0;
            joyKnob.style.transition = '0.2s';
            joyKnob.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(touch) {
            let dx = touch.clientX - joyCenter.x;
            let dy = touch.clientY - joyCenter.y;
            let distance = Math.hypot(dx, dy);
            let maxRadius = 40;

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Apply speed to player
            player.vx = (dx / maxRadius) * player.speed;
            player.vy = (dy / maxRadius) * player.speed;
        }

        // Show Toast Notification
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.opacity = 1;
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.opacity = 0;
                toast.style.transform = 'translateY(-20px)';
            }, 3000);
        }

        // Check Collisions with walls
        function checkCollisions(newX, newY) {
            // World bounds
            if (newX - player.radius < 0 || newX + player.radius > WORLD_SIZE ||
                newY - player.radius < 0 || newY + player.radius > WORLD_SIZE) {
                return true;
            }
            // Walls
            for (let w of walls) {
                let testX = newX;
                let testY = newY;
                
                if (newX < w.x) testX = w.x;
                else if (newX > w.x + w.w) testX = w.x + w.w;
                if (newY < w.y) testY = w.y;
                else if (newY > w.y + w.h) testY = w.y + w.h;

                let distX = newX - testX;
                let distY = newY - testY;
                if (Math.sqrt((distX*distX) + (distY*distY)) <= player.radius) {
                    return true;
                }
            }
            return false;
        }

        // Main Game Loop
        function update() {
            // Apply Keyboard movement if joystick isn't active
            if (!joyActive) {
                player.vx = 0; player.vy = 0;
                if (keys['ArrowUp'] || keys['w']) player.vy = -player.speed;
                if (keys['ArrowDown'] || keys['s']) player.vy = player.speed;
                if (keys['ArrowLeft'] || keys['a']) player.vx = -player.speed;
                if (keys['ArrowRight'] || keys['d']) player.vx = player.speed;
            }

            // Move player with collision checking
            if (!checkCollisions(player.x + player.vx, player.y)) {
                player.x += player.vx;
            }
            if (!checkCollisions(player.x, player.y + player.vy)) {
                player.y += player.vy;
            }

            // Camera follows player
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            // Check Item Collection
            let itemsLeft = 0;
            items.forEach(item => {
                if (!item.collected) {
                    itemsLeft++;
                    let dist = Math.hypot(player.x - item.x, player.y - item.y);
                    if (dist < player.radius + 40) {
                        item.collected = true;
                        document.getElementById(item.id).classList.add('found');
                        showToast(`You found: ${item.icon}`);
                        
                        // Check Win Condition
                        if (items.filter(i => !i.collected).length === 0) {
                            setTimeout(triggerEnding, 1000);
                        }
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Draw Biomes
            biomes.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                // Draw biome labels faintly on the floor
                ctx.fillStyle = "rgba(0,0,0,0.1)";
                ctx.font = "bold 60px Fredoka One";
                ctx.textAlign = "center";
                ctx.fillText(b.name, b.x + b.w/2, b.y + b.h/2);
            });

            // Draw Walls
            ctx.fillStyle = "#2c3e50";
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = "#1a252f";
                ctx.lineWidth = 5;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // Draw Items
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            items.forEach(item => {
                if (!item.collected) {
                    // Make items float/bounce slightly
                    let bounce = Math.sin(Date.now() / 200) * 10;
                    ctx.fillText(item.icon, item.x, item.y + bounce);
                    
                    // Glow effect
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bounce, 40, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                    ctx.fill();
                }
            });

            // Draw Player (Glowing Orb)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = "white";
            ctx.fill();
            ctx.shadowBlur = 0; // reset
            
            // Draw Player Direction Indicator
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius/2, 0, Math.PI * 2);
            ctx.fillStyle = "#333";
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Trigger the Ending Sequence
        function triggerEnding() {
            document.getElementById('ending-screen').classList.add('visible');
            document.getElementById('joystick-zone').style.display = 'none'; // hide controls
            
            // Continuous Confetti
            let duration = 5000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 9999
                });
                confetti({
                    particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 9999
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // Start Game
        gameLoop();
    </script>
</body>
</html>
